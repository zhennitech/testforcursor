<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream - Free Movie Selection</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <i class="fas fa-film"></i>
                <h1>CineStream</h1>
            </div>
            <nav class="nav">
                <a href="#home" class="nav-link active">Home</a>
                <a href="#movies" class="nav-link">Movies</a>
                <a href="#genres" class="nav-link">Genres</a>
                <a href="#favorites" class="nav-link">Favorites</a>
            </nav>
        </div>
    </header>

    <main>
        <section id="hero" class="hero">
            <div class="container">
                <div class="hero-content">
                    <h2>Discover Amazing Movies</h2>
                    <p>Explore thousands of free movies from all genres and eras</p>
                    <div class="search-container">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" placeholder="Search for movies...">
                        </div>
                        <button id="searchBtn" class="btn-primary">Search</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="filters" class="filters">
            <div class="container">
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="popular">Popular</button>
                    <button class="filter-tab" data-filter="top_rated">Top Rated</button>
                    <button class="filter-tab" data-filter="upcoming">Upcoming</button>
                    <button class="filter-tab" data-filter="now_playing">Now Playing</button>
                </div>
                <div class="filter-controls">
                    <select id="genreFilter">
                        <option value="">All Genres</option>
                    </select>
                    <select id="yearFilter">
                        <option value="">All Years</option>
                    </select>
                    <select id="sortBy">
                        <option value="popularity.desc">Most Popular</option>
                        <option value="vote_average.desc">Highest Rated</option>
                        <option value="release_date.desc">Newest</option>
                        <option value="title.asc">Title A-Z</option>
                    </select>
                </div>
            </div>
        </section>

        <section id="movies" class="movies-section">
            <div class="container">
                <div class="section-header">
                    <h3 id="sectionTitle">Popular Movies</h3>
                    <div class="results-info">
                        <span id="resultsCount">Loading...</span>
                    </div>
                </div>
                <div id="moviesGrid" class="movies-grid">
                    <!-- Loading spinner -->
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading movies...</p>
                    </div>
                </div>
                <div class="pagination">
                    <button id="prevBtn" class="btn-secondary" disabled>
                        <i class="fas fa-chevron-left"></i>
                        Previous
                    </button>
                    <div class="page-info">
                        <span id="currentPage">1</span> of <span id="totalPages">1</span>
                    </div>
                    <button id="nextBtn" class="btn-secondary">
                        Next
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- Movie Modal -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="movieDetails" class="movie-details">
                <!-- Movie details will be loaded here -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 CineStream. All rights reserved.</p>
            <p>Movie data provided by <a href="https://www.themoviedb.org/" target="_blank">The Movie Database</a></p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
